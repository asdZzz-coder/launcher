name: Release

# 推送 v* 標籤（例如 v1.3.0）就會自動測試、產生安裝檔並發佈到 GitHub Releases。
# 已安裝的啟動器下次檢查更新時會顯示「APP 啟動器有新版本」，按一下就能更新。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 自動測試沒過就不發佈
      - name: Test
        run: dotnet test AppLauncher.Tests/AppLauncher.Tests.csproj

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet build Installer -c Release -p:AppVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item Installer/bin/x64/Release/AppLauncher-Setup.msi | Select-Object Name, Length

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "下載 AppLauncher-Setup.msi 執行即可安裝或更新。已安裝的啟動器會自動提示更新。"
          gh release create "${{ github.ref_name }}" Installer/bin/x64/Release/AppLauncher-Setup.msi --title "${{ github.ref_name }}" --notes $notes
